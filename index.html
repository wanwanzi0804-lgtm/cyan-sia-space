<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIA SPACE · Cyan</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1d2329; --muted:#8a939c; --line:#e7ebef;
  --accent:#16c2c8; --accent2:#7b6cff; --accent-soft:#e3f8f9; --danger:#ff4d6d;
  --shadow:0 1px 3px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1316; --card:#181e23; --text:#e8edf1; --muted:#87929c; --line:#262e35; --accent-soft:#11373a; --shadow:none; }
}
:root[data-theme="dark"]{ --bg:#0f1316; --card:#181e23; --text:#e8edf1; --muted:#87929c; --line:#262e35; --accent-soft:#11373a; --shadow:none; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:76px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.logo{font-weight:800;letter-spacing:.5px;font-size:19px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.iconbtn{position:relative;border:0;background:transparent;font-size:20px;padding:4px 6px}
.badge{position:absolute;top:-2px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:17px;text-align:center;font-weight:700}
.badge:empty{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{display:flex;width:100%;max-width:560px}
.tab{flex:1;border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);position:relative}
.tab .ic{font-size:20px;line-height:1.2}
.tab.on{color:var(--accent);font-weight:700}
.tab .badge{top:3px;right:calc(50% - 22px)}
main{padding:0 12px}
main.flush{padding:0}
.bb{display:flex;flex-direction:column;height:calc(100dvh - 116px - env(safe-area-inset-bottom));background:var(--card)}
.bb-head{display:flex;align-items:center;justify-content:center;position:relative;padding:10px 12px 4px;background:var(--card)}
.bb-title{font-weight:800;font-size:17px}
.bb-more{position:absolute;right:6px;border:0;background:none;font-size:22px;padding:2px 12px}
.bb-top{background:var(--card);padding:14px 22px 10px;border-radius:0 0 22px 22px;box-shadow:0 6px 14px rgba(0,0,0,.06);position:relative;z-index:2}
.bb-top{cursor:pointer}
.bb-tick{height:26px;overflow:hidden;font-size:16px;color:var(--text)}
.bb-tick .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:26px;line-height:26px}
.bb-handle{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0}
.bb-tick .ti.in{animation:tickin .35s ease-out}
@keyframes tickin{from{transform:translateY(100%);opacity:0}}
.bb-tick .st{font-size:17px}
.bb-tick b{font-weight:600;font-size:13px;flex:none}
.bb-tick .tt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bb-tick .tz{color:var(--muted);font-size:12px}
.bb-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.bb-at{border:0;background:var(--bg);color:var(--accent);font-weight:800;font-size:17px;width:36px;height:36px;border-radius:50%;flex:none;margin-bottom:2px}
.bb-fan{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;font-weight:700}
.bb-msg .bb-fan{background:rgba(255,255,255,.22);color:#fff}
.bb-chat{flex:1;overflow-y:auto;padding:26px 12px 14px;margin-top:-14px}
.bb-row{display:flex;gap:8px;margin:10px 0;align-items:flex-end}
.bb-row.me{justify-content:flex-end}
.bb-t{font-size:10.5px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.45);white-space:nowrap}
.bb-msg{max-width:76%;background:rgba(58,58,62,.9);color:#fff;border-radius:18px;padding:9px 13px;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bb-txt{white-space:pre-wrap}
.bb-msg.bare{padding:4px}
.bb-media{display:block;max-width:220px;max-height:300px;border-radius:14px}
.bb-voice{border:0;background:transparent;color:#fff;font-weight:600;padding:2px 4px}
.bb-voice .wave{letter-spacing:1px;opacity:.8}
.bb-quote{background:#fff;color:#222;border-radius:12px;padding:8px 10px;margin:-2px -5px 8px;border-bottom:1.5px dashed #f2a6bd;font-size:14px}
.bb-quote .q-to{font-size:12px;color:#888}
.bb-quote .q-zh{color:#e8467c;font-size:13.5px}
.bb-st{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bb-from{font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);margin:0 0 3px 4px;letter-spacing:.5px}
.bb-fb{background:#fff;border-radius:18px;padding:10px 14px;font-size:24px;line-height:1.2;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);letter-spacing:2px;white-space:nowrap}
.bb-fb.open{width:calc(5 * 1.45em + 28px);text-align:center;overflow:hidden}
.bb-arrow{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.6);color:#555;font-size:14px;flex:none}
.bb-welcome{background:rgba(255,255,255,.88);border-radius:14px;padding:8px 12px;margin:0 auto 12px;max-width:90%;font-size:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1);white-space:pre-wrap}
.bb-wait{text-align:center;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);font-size:13px;margin:16px 0 4px}
.bb-comp{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--card)}
.bb-comp textarea{min-height:40px;max-height:110px;border-radius:20px;padding:9px 14px;resize:none;background:var(--bg);border:0}
.bb-plus{border:0;background:none;font-size:26px;width:36px;height:40px;flex:none}
.bb-send{border:0;width:40px;height:40px;border-radius:50%;background:#111;color:#fff;font-size:20px;flex:none}
.bb-rbar{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--bg);border-top:1px solid var(--line);font-size:13px}
.bb-recbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg);font-size:14px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#ff2d55;animation:pulse 1s infinite}
#bb-side{position:fixed;inset:0;z-index:85}
.bb-side-mask{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .25s}
#bb-side.on .bb-side-mask{background:rgba(0,0,0,.45)}
.bb-side-panel{position:absolute;top:0;right:0;bottom:0;width:min(78vw,360px);background:var(--card);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;padding-top:env(safe-area-inset-top)}
#bb-side.on .bb-side-panel{transform:none}
.bb-side-top{display:flex;padding:12px 16px;border-bottom:1px solid var(--line)}
.bb-bell{border:0;background:none;font-size:24px}
.bb-bell.muted{filter:grayscale(1);opacity:.55}
.bb-side-me{display:flex;gap:14px;align-items:center;padding:22px 18px}
.bb-ring{padding:3px;border-radius:50%;border:2.5px solid #ff7a2f}
.bb-side-bot{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bb-side-bot button{flex:1;border:0;background:none;font-size:26px;padding:14px 0}
.bb-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.bb-gal img,.bb-gal video{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px;background:#000}
.bb-walls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.bb-wall{border:2px solid transparent;background:none;border-radius:12px;padding:4px;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;color:var(--text)}
.bb-wall span{width:100%;aspect-ratio:3/4;border-radius:8px;border:1px solid var(--line)}
.bb-wall.on{border-color:var(--accent)}
.bb-menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:var(--card);padding:14px;border-radius:12px;margin-bottom:8px;font-size:15px}
.badge.dot{display:block!important;min-width:9px;width:9px;height:9px;padding:0;top:5px;right:calc(50% - 16px)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin:0 0 12px}
.btn{white-space:nowrap;border:0;border-radius:999px;padding:8px 16px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:4px 11px;font-size:13px}
.btn:disabled{opacity:.5}
.link{border:0;background:none;padding:0;color:var(--muted);font-size:12.5px}
.link:hover{color:var(--accent)}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;overflow:hidden;background:#ccc}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:30px;height:30px;font-size:12px}
.av.lg{width:74px;height:74px;font-size:28px}
.artist{display:inline-block;margin-left:5px;padding:0 6px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:10.5px;font-weight:700;vertical-align:1px}
.lang{display:inline-block;margin-left:5px;padding:0 5px;border-radius:5px;border:1px solid var(--line);font-size:10px;color:var(--muted);vertical-align:1px}
.hero{display:flex;gap:14px;align-items:center}
.hero h2{margin:0;font-size:20px}
.stats{display:flex;gap:18px;margin-top:4px}
.stats b{font-size:16px}
.composer textarea{border:0;padding:4px 2px;min-height:70px;background:transparent}
.cmp-prev{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.cmp-prev .pv{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:#000}
.cmp-prev .pv img,.cmp-prev .pv video{width:100%;height:100%;object-fit:cover}
.cmp-prev .pv button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px;padding:0}
.post .ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.ptext{white-space:pre-wrap;word-break:break-word}
.post.clip .ptext{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.media{display:grid;gap:4px;margin-top:10px;border-radius:12px;overflow:hidden}
.media.n1{grid-template-columns:1fr}
.media.n2,.media.n4{grid-template-columns:1fr 1fr}
.media.n3,.media.n5,.media.n6,.media.n7,.media.n8,.media.n9{grid-template-columns:1fr 1fr 1fr}
.media .m{position:relative;background:#111;aspect-ratio:1/1}
.media.n1 .m{aspect-ratio:auto;max-height:520px}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}
.media.n1 img,.media.n1 video{object-fit:contain;max-height:520px}
.media .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:34px;text-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none}
.pact{display:flex;gap:20px;margin-top:10px;color:var(--muted);font-size:14px}
.pact b{color:var(--text);font-weight:600}
.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25);color:var(--danger)}}
.detail-top{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.cmt{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.cmt:first-child{border-top:0}
.cmt.new{animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}}
.cb{flex:1;min-width:0}
.cn{font-weight:600;font-size:13.5px}
.ct{white-space:pre-wrap;word-break:break-word;margin:1px 0}
.tr{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:7px;margin:3px 0}
.cm{display:flex;gap:14px;align-items:center;margin-top:2px}
.liked{color:var(--danger)!important}
.replies{margin-top:6px}
.rep{display:flex;gap:8px;padding:7px 0 0}
.rep .ct{font-size:14px}
.at{color:var(--accent);font-weight:600}
.rbox .row{margin-top:8px}
.cmt.me>.cb>.ct,.rep.me .ct{color:var(--accent2)}
.flash{animation:flash 2s}
@keyframes flash{0%,40%{background:var(--accent-soft)}}
.cbar{position:sticky;bottom:66px;display:flex;gap:8px;background:var(--card);padding:10px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px}
.newpill[hidden]{display:none}
.newpill{display:block;margin:0 auto 8px;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:5px 14px;font-size:13px}
.notif{display:flex;gap:10px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.notif:first-child{border-top:0}
.notif.unread{background:linear-gradient(90deg,var(--accent-soft),transparent 70%);border-radius:10px}
.notif .nic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none;background:var(--accent-soft)}
.notif .nt{font-size:14px}
.notif .ns{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#toasts{position:fixed;top:10px;left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;max-width:520px;width:100%;background:var(--card);color:var(--text);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px 14px;display:flex;gap:10px;align-items:center;animation:tin .3s;cursor:pointer;font-size:14px}
.toast .ns{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(-14px)}}
#modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
@media (min-width:600px){#modal{align-items:center}#modal .sheet{border-radius:20px}}
.sheet h3{margin:4px 0 12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px;color:var(--text)}
.days input{width:auto}
.sec-title{font-weight:700;margin:16px 4px 8px;display:flex;align-items:center;gap:8px}
.week{display:flex;gap:4px;align-items:center}
.day{flex:1;border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.day b{font-size:16px;color:var(--text)}
.day.on{background:var(--accent);color:#fff}
.day.on b{color:#fff}
.day.today b{text-decoration:underline;text-underline-offset:3px}
.dots{display:flex;gap:2px;height:5px;margin-top:2px}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.sched{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.sched:first-child{border-top:0}
.sched .time{width:52px;flex:none;font-weight:700;font-size:14px}
.sched .time span{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.sched .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.sched.done .stitle{text-decoration:line-through;color:var(--muted)}
.chip{display:inline-block;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;color:#fff;margin-right:5px;vertical-align:1px}
.status{font-size:12px;font-weight:600}
.status.now{color:var(--danger)}
.chk{width:22px;height:22px;flex:none;accent-color:var(--accent);margin-top:2px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.pcats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.pcat{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px}
.pcat.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.plist{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:4px}
.preset{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font-size:14px}
.preset .muted{width:100%;font-size:12px}
.preset.dice{justify-content:center;border-style:dashed;font-weight:600;color:var(--accent)}
.preset.dice .muted{text-align:center}
.preset.on{border-color:var(--accent);background:var(--accent-soft)}
.rule{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rule:first-child{border-top:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.switch input{width:auto;transform:scale(1.25)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.kpi div{background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.kpi b{display:block;font-size:16px}
.kpi span{font-size:11.5px;color:var(--muted)}
/* live */
#live-layer{position:fixed;inset:0;z-index:80;background:#000;color:#fff;overflow:hidden}
#live-layer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
video.bv-glow{pointer-events:none}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 0;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.voice-pv{background:radial-gradient(circle at 50% 40%,#2fd3d8,#6a5cff 65%,#1b1442);aspect-ratio:4/3}
.voice-bg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;padding-top:17vh;background:radial-gradient(circle at 50% 35%,#2fd3d8,#6a5cff 60%,#1b1442)}
.voice-av{transition:transform .12s,box-shadow .12s;box-shadow:0 0 0 6px rgba(255,255,255,.2)}
.voice-tag{font-size:14px;opacity:.85}
#lv-beauty{position:absolute;left:10px;right:10px;bottom:70px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border-radius:14px;padding:10px;z-index:3}
#lv-beauty .pcat{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
#lv-beauty .pcat.on{background:var(--accent)}
.lv-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 22%,transparent 55%,rgba(0,0,0,.6));pointer-events:none}
.lv-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 14px 8px;font-size:14px;font-weight:600}
.lv-badge{background:#ff2d55;border-radius:6px;padding:1px 8px;font-weight:800;letter-spacing:.5px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.65}}

let BBREC = null, bbAudio = null;
async function bbRecStart() {
  if (BBREC) return;
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(st), chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    BBREC = { st, mr, chunks, start: Date.now(), timer: setInterval(() => { const el = $('#bb-rec-t'); if (el && BBREC) el.textContent = fmtDur((Date.now() - BBREC.start) / 1000); }, 300) };
    mr.start();
    $('#bb-rec').innerHTML = `<div class="bb-recbar"><span class="rec-dot"></span>录音中 <b id="bb-rec-t">0:00</b><span class="sp"></span><button class="btn ghost sm" data-act="bbreccancel">取消</button><button class="btn primary sm" data-act="bbrecsend">发送</button></div>`;
  } catch (e) { toast('无法使用麦克风', camErr(e)); }
}
function bbRecStop(send) {
  const R = BBREC; if (!R) return; BBREC = null; clearInterval(R.timer);
  R.mr.onstop = () => { R.st.getTracks().forEach(t => t.stop()); if (send && R.chunks.length) bbSend('voice', { blob: new Blob(R.chunks, { type: R.mr.mimeType || 'audio/mp4' }), dur: (Date.now() - R.start) / 1000 }); };
  try { R.mr.stop(); } catch (e) { }
  const bar = $('#bb-rec'); if (bar) bar.innerHTML = '';
}

function schedReminders() {

    }
  }
}

    <div class="row"><button class="btn ghost" data-act="aitest">测试连接</button><span class="sp"></span><button class="btn primary" data-act="aisave">保存</button></div>
  </div>
  <div class="sec-title">⚙ 其他设置</div>
  <div class="card">
    <div class="switch"><span>外语评论自动显示翻译</span><input type="checkbox" id="pf-tr" ${S.prefs.autoTr ? 'checked' : ''}></div>
    <div class="switch"><span>页面在后台时弹出系统通知</span><input type="checkbox" id="pf-sys" ${S.prefs.sysNotif ? 'checked' : ''}></div>
    <div class="switch"><span>时间流速（测试用，加速后热度衰减更快）</span><select id="pf-speed" style="width:auto">${[1, 5, 20, 60].map(v => `<option value="${v}" ${S.prefs.speed == v ? 'selected' : ''}>${v}×</option>`).join('')}</select></div>
  </div>
  <div class="sec-title">🗄 数据</div>
  <div class="card">
    <p class="muted" style="margin-top:0">所有数据都保存在你这个浏览器里（换浏览器或清除网站数据会丢失）。</p>
    <div class="row wrap"><button class="btn ghost" data-act="export">导出数据（JSON）</button><label class="btn ghost">导入数据<input type="file" id="imp-file" accept="application/json" hidden></label><span class="sp"></span><button class="btn danger" data-act="reset">重置全部</button></div>
  </div>
  `;
}

/* =========================================================
   模态框
   ========================================================= */
function openModal(html) { $('#sheet').innerHTML = html; $('#modal').classList.add('on'); hydrate($('#sheet')); }
function closeModal() { $('#modal').classList.remove('on'); $('#sheet').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* =========================================================
   事件
   ========================================================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  switch (a) {
    case 'tab': stopPreview(); UI.tab = t.dataset.tab; if (UI.tab !== 'feed') UI.postId = null; else if (t.closest('.tabbar')) UI.postId = null; render(); window.scrollTo(0, 0); break;
    case 'open': UI.postId = t.dataset.id; UI.sort = 'new'; render(); window.scrollTo(0, 0); break;
    case 'back': UI.postId = null; render(); break;
    case 'publish': publish(); break;
    case 'imgtag': { const k = t.dataset.k; draftTags = draftTags.includes(k) ? draftTags.filter(x => x !== k) : [...draftTags, k]; t.classList.toggle('on', draftTags.includes(k)); break; }
    case 'unpend': { const f = pending.splice(+t.dataset.i, 1)[0]; if (f) URL.revokeObjectURL(f._url); renderPending(); break; }
    case 'delpost': {
      if (!confirm('删除这条帖子？')) break;
      const p = S.posts.find(x => x.id === t.dataset.id);
      if (p) { p.media.forEach(m => idbDel(m.id)); S.posts = S.posts.filter(x => x !== p); }
      UI.postId = null; save(); render(); break;
    }
    case 'sort': UI.sort = t.dataset.s; render(); break;
    case 'refresh': render(); break;
    case 'tr': { const tr = t.previousElementSibling; tr.hidden = !tr.hidden; t.textContent = tr.hidden ? '查看翻译' : '隐藏翻译'; break; }
    case 'clike': {
      const post = S.posts.find(x => x.id === UI.postId); const c = post && post.comments.find(x => x.id === t.dataset.cid); if (!c) break;
      c.liked = !c.liked; c.likes += c.liked ? 1 : -1; t.classList.toggle('liked', c.liked); updCommentLikes(c); save();
      if (c.liked && !c.me && Math.random() < .5) later(rand(4000, 15000), () => pushNotif({ type: 'reply', postId: post.id, cid: c.id, text: `${c.user} 发现你点赞了TA的评论！`, sub: '「啊啊啊啊被' + S.profile.name + '点赞了！！」' }, true));
      break;
    }
    case 'reply': openReplyBox(t.dataset.cid, t.dataset.rid); break;
    case 'sendrep': sendReply(); break;
    case 'mycmt': myComment(); break;
    case 'zoom': openModal(`<img src="${urlCache[t.dataset.mid2] || ''}" style="width:100%;border-radius:12px"><div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn ghost" data-act="close">关闭</button></div>`); break;
    case 'opennotif': { const n = S.notifs.find(x => x.id === t.dataset.nid); if (n) openNotif(n); break; }
    case 'clearnotif': if (confirm('清空所有通知？')) { S.notifs = []; save(); render(); } break;
    case 'pvcam': previewCam(); break;
    case 'bbmenu': bbSideOpen(); break;
    case 'bbtickopen': { const g = [...S.bubble.groups].reverse().find(x => x.fans.length); if (g) openModal(bbListHTML(g)); break; }
    case 'bbinsw': { const inp = $('#bb-s-welcome'); const a = inp.selectionStart ?? inp.value.length; inp.value = inp.value.slice(0, a) + BB_TOK + inp.value.slice(inp.selectionEnd ?? a); inp.focus(); break; }
    case 'bblaunch': {
      const w = $('#bb-s-welcome').value.trim(); if (!w) { toast('请先写一句欢迎语'); break; }
      const B = S.bubble; B.welcome = w; B.name = $('#bb-s-name').value.trim(); B.fanName = $('#bb-s-fan').value.trim();
      B.openedAt = B.openedAt || Date.now();
      // 开通瞬间：一批粉丝马上订阅，收到欢迎语后来打招呼
      const n = Math.round(bbSubs() * rand(.15, .3)), now = Date.now();
      for (let i = 0; i < n; i++) B.pending.push({ at: now + 2000 + Math.pow(Math.random(), 2) * 300000, line: Math.random() < .85 ? { lang: 'zh', text: fill(pick(BB_LINES.newsub)) } : (() => { const l = pickLang() === 'zh' ? 'ko' : pickLang(); const it = pick(BB_FOREIGN[l] || BB_FOREIGN.ko); return { lang: l, text: it[0], zh: it[1] }; })() });
      logAct('bubble'); save(); render();
      pushNotif({ type: 'system', text: 'Bubble 开通啦 🫧', sub: `已有 ${fmtNum(bbSubs())} 位粉丝订阅，他们都收到了你的欢迎语` }, true);
      break;
    }
    case 'bbsideclose': bbSideClose(); break;
    case 'bbmute': S.bubble.muted = !S.bubble.muted; t.classList.toggle('muted', S.bubble.muted); t.textContent = S.bubble.muted ? '🔕' : '🔔'; save(); updBadges(); toast(S.bubble.muted ? 'Bubble 已静音' : 'Bubble 通知已开启'); break;
    case 'bbgallery': bbSideClose(); openModal(bbGalleryHTML()); break;
    case 'bbsettings': bbSideClose(); openModal(bbSettingsHTML()); break;
    case 'bbwall': S.bubble.wall = t.dataset.k; $$('.bb-wall').forEach(x => x.classList.toggle('on', x === t)); bbWallpaper(); save(); break;
    case 'bbsave': S.bubble.name = $('#bb-name').value.trim(); S.bubble.fanName = $('#bb-fanname').value.trim(); S.bubble.welcome = $('#bb-welcome').value.trim() || S.bubble.welcome; save(); closeModal(); render(); toast('聊天室设置已保存'); break;
    case 'bbins': { const inp = $('#bb-in'); const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a; inp.value = inp.value.slice(0, a) + BB_TOK + inp.value.slice(b); UI.bbDraft = inp.value; inp.focus(); inp.selectionStart = inp.selectionEnd = a + BB_TOK.length; break; }
    case 'bbsend': { const inp = $('#bb-in'); const text = inp.value.trim(); if (!text) break; inp.value = ''; inp.style.height = ''; UI.bbDraft = ''; bbSend('text', { text }); break; }
    case 'bbplus': openModal(`<div class="bb-menu"><button data-act="bbpickfile">🖼 照片 / 视频</button><button data-act="bbvoice">🎙 录语音</button><button data-act="close" style="justify-content:center;color:var(--muted)">取消</button></div>`); break;
    case 'bbpickfile': closeModal(); $('#bb-file').click(); break;
    case 'bbvoice': closeModal(); bbRecStart(); break;
    case 'bbreccancel': bbRecStop(false); break;
    case 'bbrecsend': bbRecStop(true); break;
    case 'bbopen': { const g = S.bubble.groups.find(x => x.id === t.dataset.g); if (g) openModal(bbListHTML(g)); break; }
    case 'bbreply': {
      const g = S.bubble.groups.find(x => x.id === t.dataset.g), f = g && g.fans.find(x => x.id === t.dataset.f); if (!f) break;
      S.bubble.replyTo = { user: f.user, text: f.text, zh: f.zh, lang: f.lang }; closeModal(); bbReplyBar(); $('#bb-in')?.focus(); break;
    }
    case 'bbrcancel': S.bubble.replyTo = null; bbReplyBar(); break;
    case 'bbplay': {
      if (bbAudio) { bbAudio.pause(); const same = bbAudio._mid === t.dataset.mid; bbAudio = null; if (same) break; }
      const u = urlCache[t.dataset.mid] || await mediaURL(t.dataset.mid); if (!u) break;
      bbAudio = new Audio(u); bbAudio._mid = t.dataset.mid; bbAudio.onended = () => { bbAudio = null; }; bbAudio.play().catch(e => toast('播放失败', e.message)); break;
    }
    case 'crate': S.prefs.chatRate = +t.dataset.v; save(); render(); break;
    case 'ldel': if (confirm('删除这条直播记录？')) { S.lives = S.lives.filter(l => String(l.start) !== t.dataset.s); save(); render(); } break;
    case 'lmode': stopPreview(); S.prefs.liveMode = t.dataset.m; save(); render(); break;
    case 'bpreset': {
      S.prefs.beauty = Object.assign(beautyCfg(), { preset: t.dataset.k }); save(); applyBeauty();
      const panel = t.closest('.bpanel'); panel.outerHTML = beautyPanelHTML(); break;
    }
    case 'golive': startLive(); break;
    case 'livepost': closeModal(); UI.tab = 'feed'; UI.postId = null; draft = `今天的直播谢谢大家陪我！${'\n'}聊得好开心，下次见～ 🐱💙`; render(); $('#cmp-text')?.focus(); break;
    case 'close': closeModal(); break;
    case 'sdate': UI.schedDate = t.dataset.k; render(); break;
    case 'sdone': { const k = t.dataset.dk; if (t.checked) S.schedule.done[k] = 1; else delete S.schedule.done[k]; save(); render(); break; }
    case 'pcat': UI.presetCat = t.dataset.c; UI.presetQ = ''; $('#preset-q').value = ''; $$('.pcat').forEach(x => x.classList.toggle('on', x === t)); $('#plist').innerHTML = presetListHTML(); break;
    case 'prand': {
      const list = presetMatches(); if (!list.length) break;
      let it = pick(list); for (let i = 0; i < 5 && it[1] === $('#r-title').value; i++) it = pick(list);
      $('#r-title').value = it[1]; $('#r-cat').value = it[0]; $('#r-loc').value = it[2] || '';
      $$('.preset').forEach(x => x.classList.toggle('on', x.dataset.t === it[1] && x.dataset.l === (it[2] || '')));
      toast('🎲 随机到：' + it[1], it[2] ? '📍 ' + it[2] : '记得填时间');
      $('#r-form').scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(() => $('#r-start').focus(), 350); break;
    }
    case 'preset': {
      $('#r-title').value = t.dataset.t; $('#r-cat').value = t.dataset.c; $('#r-loc').value = t.dataset.l;
      $$('.preset').forEach(x => x.classList.toggle('on', x === t));
      $('#r-form').scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(() => $('#r-start').focus(), 350); break;
    }
    case 'admin': openModal(adminHTML()); syncRepFields(); break;
    case 'redit': openModal(adminHTML(S.schedule.rules.find(x => x.id === t.dataset.id))); syncRepFields(); break;
    case 'rdel': if (confirm('删除这条行程规则？')) { S.schedule.rules = S.schedule.rules.filter(x => x.id !== t.dataset.id); save(); openModal(adminHTML()); syncRepFields(); render(); } break;
    case 'rsave': saveRule(); break;
    case 'psave': {
      const p = S.profile;
      p.name = $('#p-name').value.trim() || p.name; p.fandom = $('#p-fandom').value.trim() || p.fandom;
      p.debut = $('#p-debut').value || p.debut; p.animal = $('#p-animal').value.trim() || p.animal;
      p.followers = Math.max(0, +$('#p-fol').value || p.followers); p.folBase = p.followers;
      const a1 = Math.max(1, +$('#p-amin').value || p.activeMin), a2 = Math.max(a1, +$('#p-amax').value || p.activeMax); p.activeMin = a1; p.activeMax = a2;
      p.nicks = $('#p-nicks').value.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean);
      p.songs = $('#p-songs').value.split(/[,，、]+/).map(x => x.trim().replace(/^《|》$/g, '')).filter(Boolean);
      p.bio = $('#p-bio').value.trim(); p.fanRules = $('#p-fanrules').value.trim();
      save(); render(); toast('人设已保存'); break;
    }
    case 'aisave': S.ai.capCny = Math.max(0, +$('#ai-cap').value || 0); S.ai.enabled = $('#ai-on').checked; S.ai.key = $('#ai-key').value.trim(); S.ai.model = $('#ai-model').value; S.ai._backoff = 0; save(); render(); toast(S.ai.enabled && S.ai.key ? 'AI 粉丝已开启 ✨' : 'AI 设置已保存'); break;
    case 'aitest': {
      S.ai.key = $('#ai-key').value.trim(); S.ai.model = $('#ai-model').value;
      if (!S.ai.key) { toast('请先填写 API Key'); break; }
      t.disabled = true; t.textContent = '测试中…';
      try { const r = await aiComments([{ type: 'text', text: `${S.profile.name} 发帖：「测试一下，大家能看到吗？」请生成 3 条粉丝评论。` }], 800); S.ai.lastError = ''; S.ai._backoff = 0; save(); toast('连接成功 ✨', r.map(x => x.text).join(' / ')); }
      catch (err) { toast('连接失败', String(err.message || err)); S.ai.lastError = String(err.message || err); save(); }
      t.disabled = false; t.textContent = '测试连接'; break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(S, (k, v) => k.startsWith('_') || k === 'key' ? undefined : v, 1)], { type: 'application/json' });
      const filename = `sia-space-${dkey(Date.now())}.json`;
      // 在 claude.ai 链接里打开时走平台的下载确认；直接打开本地文件时用普通下载
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl) { try { await dl.save({ filename, data: blob }); toast('已导出'); } catch (err) { if (err && err.code !== 'declined') toast('导出失败', err.message || String(err.code)); } break; }
      const aEl = document.createElement('a'); aEl.href = URL.createObjectURL(blob); aEl.download = filename; aEl.click(); break;
    }
    case 'reset': if (confirm('确定重置所有数据？帖子、评论、行程都会清空。')) { localStorage.removeItem(STORE_KEY); indexedDB.deleteDatabase('cyan-idol-media'); location.reload(); } break;
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'cmp-file') {
    for (const f of t.files) {
      if (f.size > 300 * 1024 * 1024) { toast('文件太大了（>300MB）', f.name); continue; }
      f._url = URL.createObjectURL(f); pending.push(f);
    }
    if (pending.length > 9) { pending.slice(9).forEach(f => URL.revokeObjectURL(f._url)); pending = pending.slice(0, 9); toast('最多 9 个图片/视频'); }
    t.value = ''; renderPending();
  } else if (t.id === 'av-file' && t.files[0]) {
    const id = uid(); const f = t.files[0];
    try { await idbPut(id, f); } catch (err) { }
    urlCache[id] = URL.createObjectURL(f);
    if (S.profile.avatar) idbDel(S.profile.avatar);
    S.profile.avatar = id; save(); render(); toast('头像已更新');
  } else if (t.id === 'imp-file' && t.files[0]) {
    try { const j = JSON.parse(await t.files[0].text()); if (!j.profile || !j.posts) throw new Error('格式不对'); j.ai = Object.assign({}, S.ai, j.ai, { key: S.ai.key }); S = j; save(); location.reload(); }
    catch (err) { toast('导入失败', err.message); }
  } else if (t.id === 'bb-file' && t.files[0]) {
    const f = t.files[0]; t.value = ''; bbSend(f.type.startsWith('video') ? 'video' : 'image', { blob: f });
  } else if ((t.id === 'bb-av-file' || t.id === 'bb-wall-file') && t.files[0]) {
    const id = uid(), f = t.files[0]; try { await idbPut(id, f); } catch (err) { } urlCache[id] = URL.createObjectURL(f);
    if (t.id === 'bb-av-file') { if (S.bubble.avatar) idbDel(S.bubble.avatar); S.bubble.avatar = id; }
    else { if (S.bubble.wallImg) idbDel(S.bubble.wallImg); S.bubble.wallImg = id; S.bubble.wall = 'custom'; bbWallpaper(); }
    save(); openModal(bbSettingsHTML());
  } else if (t.id === 'r-rep') syncRepFields();
  else if (t.id === 'pf-tr') { S.prefs.autoTr = t.checked; save(); }
  else if (t.id === 'pf-speed') { S.prefs.speed = +t.value; save(); toast(`时间流速 ${t.value}×`); }
  else if (t.id === 'pf-sys') {
    S.prefs.sysNotif = t.checked; save();
    if (t.checked && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'b-level') { S.prefs.beauty = Object.assign(beautyCfg(), { level: +e.target.value }); const v = $('#b-val'); if (v) v.textContent = e.target.value; applyBeauty(); save(); }
  if (e.target.id === 'cmp-text') draft = e.target.value;
  if (e.target.id === 'cmp-desc') draftDesc = e.target.value;
  if (e.target.id === 'bb-in') { UI.bbDraft = e.target.value; e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 110) + 'px'; }
  if (e.target.id === 'preset-q') { UI.presetQ = e.target.value; $$('.pcat').forEach(x => x.classList.toggle('on', !UI.presetQ && x.dataset.c === UI.presetCat)); $('#plist').innerHTML = presetListHTML(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  if (e.target.id === 'rep-in') { e.preventDefault(); sendReply(); }
  if (e.target.id === 'my-cmt') { e.preventDefault(); myComment(); }
});

/* =========================================================
   启动
   ========================================================= */
function seedPosts() {
  if (S.seeded) return;
  S.seeded = true;
  pushNotif({ type: 'system', text: '社区开通啦！', sub: '发第一条帖子和粉丝们打个招呼吧 🐱' }, false);
}
// 旧版本数据迁移：去掉示例帖子、示例行程和旧简介
function migrate() {
  if ((S.v || 1) < 3) {
    // 「上课/练习」拆成「上课」和「练习」
    S.schedule.rules.forEach(r => { if (r.cat === '上课/练习') r.cat = /课/.test(r.title) ? '上课' : '练习'; });
  }
  if ((S.v || 1) >= 2) { S.v = Math.max(S.v || 1, 3); return; }
  const oldPosts = /^(今天的舞蹈练习终于结束啦！腿已经不是自己的了|下周就是签售会了！好想快点见到)/;
  S.posts = S.posts.filter(p => !oldPosts.test(p.text));
  S.notifs = S.notifs.filter(n => !/平行世界/.test(n.text) && (!n.postId || S.posts.some(p => p.id === n.postId)));
  if (/^平行世界 solo 歌手/.test(S.profile.bio || '')) S.profile.bio = '';
  const oldRules = ['早间体能训练', '声乐课', '舞蹈练习', '《星光音乐局》事前录制', '《周四舞台》直播打歌', '《人气旋律》打歌', 'Weverse 日常 vlog 拍摄', '杂志《MEOW》画报拍摄', '综艺《猫咪也疯狂》录制', '二辑线下签售会', '首场 Solo 演唱会《CYAN: 9.1Hz》'];
  S.schedule.rules = S.schedule.rules.filter(r => !oldRules.includes(r.title));
  delete S.schedule.flex;
  S.v = 3;
}
migrate();
seedPosts();
catchUp();
S.sim.lastTick = Date.now();
save();
render();
setInterval(tick, 1500);
setInterval(flushAgg, 6000);
setInterval(() => { if (UI.tab === 'sched' && !$('#modal').classList.contains('on') && !document.activeElement?.closest('#view input')) render(); }, 60000);
window.addEventListener('beforeunload', () => { S.sim.lastTick = Date.now(); try { localStorage.setItem(STORE_KEY, JSON.stringify(S, (k, v) => k.startsWith('_') ? undefined : v)); } catch (e) { } });
</script>
</body>
