<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SIA SPACE · Cyan</title>
<style>
.rmb{display:none!important}
:root{
  --bg:#f4f6f8; --card:#ffffff; --text:#1d2329; --muted:#8a939c; --line:#e7ebef;
  --accent:#16c2c8; --accent2:#7b6cff; --accent-soft:#e3f8f9; --danger:#ff4d6d;
  --shadow:0 1px 3px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1316; --card:#181e23; --text:#e8edf1; --muted:#87929c; --line:#262e35; --accent-soft:#11373a; --shadow:none; }
}
:root[data-theme="dark"]{ --bg:#0f1316; --card:#181e23; --text:#e8edf1; --muted:#87929c; --line:#262e35; --accent-soft:#11373a; --shadow:none; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
/* 聊天输入框用 textarea：iOS Safari 不会在上面弹「自动填充联系人 / 地址」 */
textarea.chat-in{min-height:42px;max-height:110px;resize:none;padding:10px 12px;line-height:1.35}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:76px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.logo{font-weight:800;letter-spacing:.5px;font-size:19px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.iconbtn{position:relative;border:0;background:transparent;font-size:20px;padding:4px 6px}
.badge{position:absolute;top:-2px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:17px;text-align:center;font-weight:700}
.badge:empty{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .inner{display:flex;width:100%;max-width:560px}
.tab{flex:1;border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);position:relative}
.tab .ic{font-size:20px;line-height:1.2}
.tab.on{color:var(--accent);font-weight:700}
.tab .badge{top:3px;right:calc(50% - 22px)}
main{padding:0 12px}
main.flush{padding:0}
.bb{display:flex;flex-direction:column;overflow-x:hidden;overscroll-behavior:none;background:var(--card);position:fixed;left:0;right:0;margin:0 auto;max-width:560px;top:var(--topH,52px);bottom:var(--tabH,60px)}
body.bbmode{overflow:hidden;overscroll-behavior:none}
body.bbmode #app{padding-bottom:0}
body.typing .tabbar{display:none}
body.typing .bb{bottom:0}
.bb-head{display:flex;align-items:center;justify-content:center;position:relative;padding:10px 12px 4px;background:var(--card)}
.bb-title{font-weight:800;font-size:17px}
.bb-more{position:absolute;right:6px;border:0;background:none;font-size:22px;padding:2px 12px}
.bb-top{background:var(--card);padding:14px 22px 10px;border-radius:0 0 22px 22px;box-shadow:0 6px 14px rgba(0,0,0,.06);position:relative;z-index:2}
.bb-top{cursor:pointer}
.bb-tick.bb-tick2{display:none;height:32px;font-size:15px;padding:3px 16px;color:var(--muted);background:var(--card);border-top:1px solid var(--line)}
body.typing .bb-tick.bb-tick2{display:block}
.bb-tick{height:26px;overflow:hidden;font-size:16px;color:var(--text)}
.bb-tick .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:26px;line-height:26px}
.bb-handle{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 0}
.bb-tick .ti.in{animation:tickin .35s ease-out}
@keyframes tickin{from{transform:translateY(100%);opacity:0}}
.bb-tick .st{font-size:17px}
.bb-tick b{font-weight:600;font-size:13px;flex:none}
.bb-tick .tt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bb-tick .tz{color:var(--muted);font-size:12px}
.bb-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.bb-at{border:0;background:var(--bg);color:var(--accent);font-weight:800;font-size:17px;width:36px;height:36px;border-radius:50%;flex:none;margin-bottom:2px}
.bb-fan{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:0 6px;font-weight:700}
.bb-msg .bb-fan{background:rgba(255,255,255,.22);color:#fff}
.bb-chat{flex:1;overflow-y:auto;padding:26px 12px 14px;margin-top:-14px}
.bb-row{display:flex;gap:8px;margin:10px 0;align-items:flex-end}
.bb-row.me{justify-content:flex-end}
.bb-t{font-size:10.5px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.45);white-space:nowrap}
.bb-msg{max-width:76%;background:rgba(58,58,62,.9);color:#fff;border-radius:18px;padding:9px 13px;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bb-txt{white-space:pre-wrap}
.bb-msg.bare{padding:4px}
.bb-media{display:block;max-width:220px;max-height:300px;border-radius:14px}
.bb-voice{border:0;background:transparent;color:#fff;font-weight:600;padding:2px 4px}
.bb-voice .wave{letter-spacing:1px;opacity:.8}
.bb-quote{background:#fff;color:#222;border-radius:12px;padding:8px 10px;margin:-2px -5px 8px;border-bottom:1.5px dashed #f2a6bd;font-size:14px}
.bb-quote .q-to{font-size:12px;color:#888}
.bb-quote .q-zh{color:#e8467c;font-size:13.5px}
.bb-st{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bb-from{font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);margin:0 0 3px 4px;letter-spacing:.5px}
.bb-fb{background:#fff;border-radius:18px;padding:10px 14px;font-size:24px;line-height:1.2;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);letter-spacing:2px;white-space:nowrap}
.bb-fb.open{width:calc(5 * 1.45em + 28px);text-align:center;overflow:hidden}
.bb-arrow{width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.6);color:#555;font-size:14px;flex:none}
.bb-welcome{background:rgba(255,255,255,.88);border-radius:14px;padding:8px 12px;margin:0 auto 12px;max-width:90%;font-size:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1);white-space:pre-wrap}
.bb-wait{text-align:center;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);font-size:13px;margin:16px 0 4px}
.bb-emo{border:0;background:none;color:var(--muted);font-size:24px;width:34px;height:40px;flex:none;padding:0}
.bb-emo.on{color:var(--accent)}
.bb-stkp{background:var(--card);border-top:1px solid var(--line);overflow:hidden;max-width:100%}
.bb-stkt{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);overflow:hidden}
.bb-stkt button{display:flex;align-items:center;gap:5px;border:0;background:none;border-radius:10px;padding:3px 9px 3px 4px;font-size:12px;font-weight:700;color:var(--muted)}
.bb-stkt button.on{background:var(--bg);color:var(--text)}
.bb-stkt img{width:24px;height:24px;object-fit:contain}
.bb-stkg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:8px;max-height:min(240px,34vh);overflow-x:hidden;overflow-y:auto;touch-action:pan-y}
.bb-stkg button{border:0;background:none;border-radius:12px;padding:4px 2px 2px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.bb-stkg span{font-size:10px;color:var(--muted);opacity:.75;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bb-stkg button:active{background:var(--bg)}
.bb-stkg img{width:100%;aspect-ratio:1;object-fit:contain;display:block;pointer-events:none}
.bb-msg.stk{background:none!important;box-shadow:none;padding:0}
.bb-stkimg{display:block;width:120px;height:120px;object-fit:contain}
.bb-comp{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--card)}
.bb-comp textarea{min-height:40px;max-height:110px;border-radius:20px;padding:9px 14px;resize:none;background:var(--bg);border:0}
.bb-plus{border:0;background:none;font-size:26px;width:36px;height:40px;flex:none}
.bb-send{border:0;width:40px;height:40px;border-radius:50%;background:#111;color:#fff;font-size:20px;flex:none}
.bb-save{border:0;height:40px;border-radius:20px;background:#111;color:#fff;font-size:14px;font-weight:700;padding:0 14px;flex:none;white-space:nowrap}
.bb-pbar{margin:14px -12px 8px;padding:8px 0;text-align:center;font-size:13px;color:#fff;background:rgba(120,120,128,.35);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.bb-row.pending .bb-msg{opacity:.55;cursor:pointer}
.bb-psend{border:0;background:#ff8a3d;color:#fff;font-weight:700;font-size:15px;border-radius:16px;padding:10px 16px;box-shadow:0 2px 8px rgba(255,138,61,.35);text-decoration:underline;text-underline-offset:3px}
.bb-psend span{text-decoration:none;display:inline-block;margin-left:6px}
.bb-pcount{text-align:right;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);margin:2px 4px 0}
#bb-alert{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:24px}
.bb-alert-box{background:var(--card);border-radius:16px;width:min(320px,100%);text-align:center;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.bb-alert-t{font-weight:700;font-size:17px;padding:22px 18px 6px}
.bb-alert-x{color:var(--muted);font-size:14px;padding:0 18px 20px}
.bb-alert-b{display:flex;border-top:1px solid var(--line)}
.bb-alert-b button{flex:1;border:0;background:none;padding:14px 0;font-size:16px}
.bb-alert-b button+button{border-left:1px solid var(--line);font-weight:700;color:var(--accent)}
.bb-dbox{background:var(--bg);border-top:1px solid var(--line);padding:8px 12px}
.bb-dhead{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:6px}
.bb-dlist{max-height:132px;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.bb-ditem{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:6px 10px;font-size:14px}
.bb-dtxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.bb-rbar{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--bg);border-top:1px solid var(--line);font-size:13px}
.bb-recbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg);font-size:14px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#ff2d55;animation:pulse 1s infinite}
#bb-side{position:fixed;inset:0;z-index:85}
.me-tabs{display:flex;gap:6px;margin:4px 0 2px;position:sticky;top:var(--topH,52px);z-index:5;background:var(--bg);padding:6px 0}
.me-tabs button{flex:1;border:0;background:var(--card);color:var(--muted);border-radius:12px;padding:9px 0;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.me-tabs button.on{background:var(--accent);color:#fff}
.fbars{display:flex;gap:6px;align-items:stretch;height:96px;margin-top:14px}
.fb{flex:1;display:flex;flex-direction:column;align-items:stretch;text-align:center}
.fb-up,.fb-dn{flex:1;display:flex;justify-content:center}
.fb-up{align-items:flex-end;border-bottom:1px solid var(--line)}
.fb-dn{align-items:flex-start;flex:.45}
.fb i{display:block;width:62%;min-height:2px;border-radius:4px}
.fb-up i{background:var(--accent)}
.fb-dn i{background:var(--danger)}
.fb span{font-size:11px;color:var(--muted);margin-top:3px}
.me-more{margin-top:10px;font-size:14px}
.me-more summary{cursor:pointer;color:var(--muted);padding:4px 0}
.done-tg{display:flex;width:100%;justify-content:center;gap:6px;border:0;background:var(--bg);color:var(--muted);border-radius:12px;padding:10px;margin-top:10px;font-size:13.5px}
.rule.done b{color:var(--muted)}
.cb-intro{margin-top:8px;font-size:13.5px;line-height:1.6;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px;max-height:7.5em;overflow:auto}
.alb-intro{margin-top:4px;font-size:13px;color:var(--muted)}
.alb-intro summary{cursor:pointer}
.alb-intro div{margin-top:4px;line-height:1.6}
.rmb{font-size:11.5px;color:var(--muted);font-weight:400}
.w-bal{font-size:30px;font-weight:800;letter-spacing:-.5px}
.w-bar{height:8px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:6px}
.w-bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.w-bar.sm{flex:1;height:6px;margin:0 8px}
.w-cat{display:flex;align-items:center;font-size:13.5px;margin-top:8px}
.w-cat span{width:90px;flex:none}
.w-cat b{font-size:13px;min-width:80px;text-align:right}
.w-pre{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.w-pre button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--text);display:flex;flex-direction:column;align-items:flex-start}
.w-pre span{font-size:11px;color:var(--muted)}
.ch-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ch-p{width:96px;flex:none;color:var(--muted)}
.ch-row b{min-width:58px}
.ch-row i{font-style:normal;font-size:11.5px;color:var(--muted);min-width:34px}
.ch-row i.up{color:#e5484d}
.ch-row i.dn{color:#3b82f6}
.ch-s{margin-left:auto;font-size:12px}
.me-tabs button{font-size:13px}
.sh-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.sh-row[data-act]{cursor:pointer}
.sh-win{color:#e5a100}
.sh-cand{color:var(--accent)}
.cb-warn{margin-top:8px;font-size:12.5px;color:#b35c00;background:#fff4e5;border-radius:10px;padding:6px 10px}
.cb-warn.ok{color:var(--accent);background:var(--bg)}
.mz-head{display:flex;gap:10px;align-items:flex-start}.mz-head>div{flex:1;min-width:0}
.mz-bar{height:6px;border-radius:4px;background:var(--bg);overflow:hidden;margin:5px 0 2px}.mz-bar i{display:block;height:100%;background:var(--accent);border-radius:4px}.mz-bar.o i{background:#ff8a3d}
.mz-w{padding:14px 0;border-top:1px solid var(--line);cursor:pointer}.mz-r{display:flex;align-items:center;gap:10px}.mz-w b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mz-w .muted{font-size:13px;margin-top:2px}
.mz-pct{font-size:20px;font-weight:700}.mz-pill{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--bg);white-space:nowrap}.mz-w .mz-bar{height:7px;margin-top:10px}.mz-hint{text-align:right;font-size:12.5px;color:var(--muted);margin-top:8px}
.mk-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.mk-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:14px;border:1.5px solid transparent;background:var(--card);color:var(--text);box-shadow:var(--shadow);cursor:pointer;font:inherit;text-align:center;min-width:0}.mk-card b{font-size:14px}.mk-card span{font-size:11.5px;color:var(--muted)}.mk-card.on{border-color:var(--accent);color:var(--accent)}.mk-card.on b{color:var(--text)}
.mz-eval{display:flex;gap:10px;margin-top:8px}.mz-eval>div{flex:1;background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}.mz-eval b{font-size:22px}.mz-eval span{font-size:12px;color:var(--muted,#888)}
.mz-acts{display:flex;flex-wrap:wrap;gap:8px}.mz-acts .btn{flex:1 1 auto}
.pp-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13.5px;border-top:1px solid var(--line,#eee)}.pp-row.ok{color:var(--muted,#888)}.pp-who{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--bg);white-space:nowrap;margin-top:1px}
.mv{border-top:1px solid var(--line);padding:10px 0}
.mv-h{display:flex;gap:10px;align-items:flex-start}
.mv-th{width:64px;height:40px;border-radius:8px;background:#e5484d;color:#fff;display:grid;place-items:center;flex:none;font-size:16px}
.mv-bars{display:flex;gap:6px;height:84px;margin-top:8px;align-items:stretch}
.mv-bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.mv-bars i{display:block;width:70%;background:#e5484d;border-radius:3px 3px 0 0;opacity:.8}
.mv-bars .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;font-weight:normal}
.mv-bars .now i{opacity:.45}
.mv-bars em{font-style:normal;font-size:9.5px;color:var(--muted);white-space:nowrap;margin-bottom:2px}
.mv-bars span{font-size:10.5px;color:var(--muted);margin-top:2px}
.m-tabs{margin:8px 0 4px;flex-wrap:wrap}
.ch-top{display:flex;align-items:center;gap:8px;padding:8px 6px;border-top:1px solid var(--line);font-size:14px;cursor:pointer;border-radius:8px}
.ch-top.on{background:var(--bg)}
.ch-n{width:18px;font-weight:800;color:var(--accent)}
.wct{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.wct div{background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.wct span{font-size:11.5px;color:var(--muted)}
.wct b{font-size:13px}
.rest-tg{display:flex;align-items:center;justify-content:space-between;margin:-4px 4px 10px;font-size:13px;color:var(--muted)}
.sw{position:relative;width:40px;height:24px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:12px;transition:.2s}
.sw i::after{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+i{background:#7b61ff}
.sw input:checked+i::after{left:19px}
.offer{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.mgr-card{display:flex;align-items:center;gap:10px;cursor:pointer}
.mgr-av{width:42px;height:42px;border-radius:15px;background:#ffe24a;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.mgr-av.sm{width:34px;height:34px;border-radius:12px;font-size:18px}
.mgr-av.big{width:76px;height:76px;border-radius:26px;font-size:38px;margin:0 auto}
.mgr-u{background:var(--danger);color:#fff;border-radius:10px;font-size:12px;padding:1px 7px;font-weight:700}
.kk-log{background:var(--accent-soft);border-radius:14px;padding:10px;height:min(60vh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.kk-day{align-self:center;font-size:11.5px;color:var(--muted);background:var(--card);border-radius:10px;padding:2px 10px;margin:4px 0}
.kk-row{display:flex;gap:6px;align-items:flex-end;max-width:88%}
.kk-row.me{align-self:flex-end}
.kk-n{font-size:12px;color:var(--muted);margin-bottom:2px}
.kk-b{background:#fff;color:#1d2329;border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}

  S.notifs.unshift(n); if (S.notifs.length > 300) S.notifs.length = 300;
  updBadges();
  if (UI.tab === 'notif') render();
  const viewingPost = UI.tab === 'feed' && UI.postId && UI.postId === n.postId;
  if (toastIt && !viewingPost && (!LIVE || n.type === 'sched') && Date.now() - lastToast > 3500) { lastToast = Date.now(); toast(n.text, n.sub, () => openNotif(n)); }
  sysNotify(n);
}
let lastSys = 0;
function sysNotify(n) {
  if (!S.prefs.sysNotif || !document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
  if (Date.now() - lastSys < 15000 && n.type !== 'sched') return;
  lastSys = Date.now();
  try { new Notification('SIA SPACE · ' + n.text, { body: n.sub || '' }); } catch (e) { }
}

/* 离线补算：关掉页面再打开，帖子也在继续涨 */
function catchUp() {
  const dt = Date.now() - (S.sim.lastTick || Date.now());
  if (dt < 10000) return;
  if (S.bubble) bubbleTick(dt, true);
  if (!S.posts.length) return;
  let L = 0, C = 0;
  for (const p of S.posts) { const r = simPost(p, dt, true); L += r.nl; C += r.nc; p.comments.sort((a, b) => b.at - a.at); }
  for (const k of Object.keys(agg)) delete agg[k];
  if (L + C > 0) pushNotif({ type: 'system', text: `你不在的这段时间：+${fmtNum(L)} 赞，+${fmtNum(C)} 条评论`, sub: `离开了 ${dt > 3600e3 ? Math.round(dt / 3600e3) + ' 小时' : Math.round(dt / 60e3) + ' 分钟'}` }, false);
}

/* ---------- 回复粉丝 → 粉丝反应 ---------- */
function later(ms, fn) { setTimeout(fn, ms / (S.prefs.speed || 1)); }
function addReply(post, parent, r) {
  r.id = r.id || uid(); r.at = Date.now(); r.likes = r.likes || 0;
  parent.replies.push(r); post.commentCount++;
  onNewReply(post, parent);
}
function artistReply(post, parent, target, text) {
  addReply(post, parent, { user: S.profile.name, me: true, text, to: target ? target.user : null });
  logAct('reply'); save();
  const fanTarget = target && !target.me ? target : null;
  if (aiOn()) aiReactions(post, parent, fanTarget, text);
  else tplReactions(post, parent, fanTarget, text);
}
// 粉丝对「你回复的内容」的具体回应：回答问题 / 接住回答 / 感谢 / 引用
function replyFollow(target, text) {
  const ans = answerFor(text);
  if (ans) return fill(pick(ans));
  const sn = snippet(text);
  if (target && /[?？]|吗|呢|什么|TMI|OOTD|怎么样/i.test(target.text)) return pick(['原来如此！谢谢{n}回答我', '记下了📝 谢谢{n}', '啊啊啊{n}真的回答我了', '好可爱的回答']).replace(/\{n\}/g, pick(S.profile.nicks.length ? S.profile.nicks : [S.profile.name]));
  if (/谢谢|感谢/.test(text)) return pick(['不客气！应该的', '是我们要谢谢你', '呜呜呜不用谢']);
  if (tone(text) === 'neg') return pick(['对不起…是我说错什么了吗', '呜呜好吧', '不要生气嘛']);
  if (/爱你|喜欢你|想你/.test(text)) return pick(['我也爱你！！！', '我更爱你', '心脏骤停']);
  if (/晚安|早点睡|去睡/.test(text)) return pick(['晚安！！好梦', '好的我这就去睡', '{n}也早点睡']).replace('{n}', pick(S.profile.nicks.length ? S.profile.nicks : [S.profile.name]));
  if (/吃饭|多吃|好好吃/.test(text)) return pick(['好！我会好好吃饭的', '遵命！', '{n}也要好好吃饭']).replace('{n}', pick(S.profile.nicks.length ? S.profile.nicks : [S.profile.name]));
  if (/加油|努力/.test(text)) return pick(['我会加油的！！', '一起加油！', '有{n}这句话什么都能做到']).replace('{n}', pick(S.profile.nicks.length ? S.profile.nicks : [S.profile.name]));
  return null;
}
function tplReactions(post, parent, target, text = '') {
  if (target) {
    later(rand(3000, 12000), () => {
      const follow = replyFollow(target, text);
      const b = (target.lang || 'zh') === 'zh' && follow && Math.random() < .5 ? { lang: 'zh', text: fill(follow), zh: null } : reactLine(target.lang || 'zh');
      addReply(post, parent, { user: target.user, color: target.color, lang: b.lang, text: b.text, zh: b.zh, to: S.profile.name });
      pushNotif({ type: 'reply', postId: post.id, cid: parent.id, text: `${target.user} 回复了你`, sub: b.text }, true);
      // 激动完再补一句具体回应
      if (follow && b.text !== fill(follow) && (target.lang || 'zh') === 'zh') later(rand(4000, 10000), () => { addReply(post, parent, { user: target.user, color: target.color, lang: 'zh', text: fill(follow), to: S.profile.name }); save(); });
      save();
    });
    target.likes += ri(30, 120); updCommentLikes(target);
    const others = ri(1, 4), otherLines = pickN(REACT_OTHER, others);
    for (let i = 0; i < others; i++) later(rand(6000, 40000), () => {
      const f = makeFan('zh'); addReply(post, parent, { user: f.user, color: f.color, lang: 'zh', text: fill(otherLines.shift() || pick(REACT_OTHER)), to: target.user });
      target.likes += ri(10, 60); updCommentLikes(target); save();
    });
  } else {
    const k = ri(3, 7), ans = answerFor(text);
    // 先挑好不重复的回复：有问题就多数在回答，其余是起哄
    const zhLines = pickN(ans || [], ans ? Math.ceil(k * .65) : 0).concat(pickN(REACT_ARTIST_CMT, k));
    for (let i = 0; i < k; i++) later(rand(3000, 45000), () => {
      const f = makeFan(); const lang = f.lang;
      const b = lang === 'zh' ? { lang, text: fill(zhLines.shift() || pick(REACT_ARTIST_CMT)), zh: null } : reactLine(lang);
      addReply(post, parent, { user: f.user, color: f.color, lang: b.lang, text: b.text, zh: b.zh, to: S.profile.name });
      parent.likes += ri(20, 90); updCommentLikes(parent);
      if (i === 0) pushNotif({ type: 'reply', postId: post.id, cid: parent.id, text: `${f.user} 回复了你的评论`, sub: b.text }, true);
      save();
    });
  }
}
async function aiReactions(post, parent, target, text) {
  try {
    const n = target ? ri(2, 3) : ri(3, 4);
    const prompt = target
      ? `${S.profile.name}（偶像本人）在自己的帖子「${post.text || '（图片/视频帖）'}」下面，回复了粉丝「${target.user}」的评论。\n粉丝原评论（${LANG_NAME[target.lang || 'zh']}）：「${target.text}」\n${S.profile.name} 的回复：「${text}」\n请生成 ${n} 条楼中楼回复：第 1 条必须是粉丝「${target.user}」本人被偶像回复后的反应（用${LANG_NAME[target.lang || 'zh']}写，要接住偶像的回复内容），其余是围观粉丝的反应（羡慕、起哄、接话等）。`
      : `${S.profile.name}（偶像本人）在自己的帖子「${post.text || '（图片/视频帖）'}」下面发了一条评论：「${text}」\n请生成 ${n} 条粉丝在这条评论下的楼中楼回复，要针对她说的内容来回应。`;
    const list = await aiComments([{ type: 'text', text: prompt }], 3000);
    list.forEach((b, i) => later(i === 0 ? rand(3000, 9000) : rand(6000, 40000), () => {
      const isTarget = target && i === 0;
      const f = isTarget ? target : makeFan(b.lang);
      addReply(post, parent, { user: isTarget ? target.user : b.user, color: f.color, lang: b.lang, text: b.text, zh: b.zh, to: target ? target.user : S.profile.name });
      (target || parent).likes += ri(15, 80); updCommentLikes(target || parent);
      if (i === 0) pushNotif({ type: 'reply', postId: post.id, cid: parent.id, text: `${isTarget ? target.user : b.user} 回复了你`, sub: b.text }, true);
      save();
    }));
  } catch (e) { aiFail(e); tplReactions(post, parent, target, text); }
}

function toast(text, sub = '', onClick) {
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<div style="font-size:20px">🔔</div><div style="min-width:0;flex:1"><div>${esc(text)}</div>${sub ? `<div class="ns">${esc(sub)}</div>` : ''}</div>`;
  // 像手机通知一样：往上划（或左右划）就收起；轻点才打开
  let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, moved = false, timer;
  const dismiss = (toX, toY) => { el.style.transition = 'transform .2s ease-in, opacity .2s'; el.style.transform = `translate(${toX}px,${toY}px)`; el.style.opacity = '0'; setTimeout(() => el.remove(), 200); };
  el.addEventListener('pointerdown', e => { dragging = true; moved = false; sx = e.clientX; sy = e.clientY; dx = dy = 0; el.style.transition = 'none'; clearTimeout(timer); el.setPointerCapture?.(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (!dragging) return; dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
    el.style.transform = Math.abs(dx) > Math.abs(dy) ? `translateX(${dx}px)` : `translateY(${Math.min(dy, dy * .25)}px)`;
  });
  const end = () => {
    if (!dragging) return; dragging = false;
    if (dy < -25 && Math.abs(dy) >= Math.abs(dx)) return dismiss(0, -140);
    if (Math.abs(dx) > 80) return dismiss(dx > 0 ? 500 : -500, 0);
    el.style.transition = 'transform .2s'; el.style.transform = ''; timer = setTimeout(() => el.remove(), 2500);
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.onclick = () => { if (moved) return; el.remove(); onClick && onClick(); };
  const box = $('#toasts'); box.prepend(el);
  while (box.children.length > 3) box.lastElementChild.remove();
  timer = setTimeout(() => el.remove(), 4200);
}

      const id = UI.alb.id; if (S.cb && !S.cb.over && S.cb.albumId === id) { toast('这张正在回归中，先取消回归才能删除'); break; }
      bbConfirm('删除作品？', `《${UI.alb.name}》会从歌单里删除`, () => { S.disco = disco().filter(x => x.id !== id); syncSongs(); save(); closeModal(); render(); }); break;
    }
    case 'cbcancel': bbConfirm('取消回归？', `《${cbAlbum()?.name || ''}》的回归计划会被取消（歌会留在歌单里）`, () => { prepCancel(); S.cb = null; save(); render(); }); break;
    case 'psave': {
      const p = S.profile;
      p.name = $('#p-name').value.trim() || p.name; p.fandom = $('#p-fandom').value.trim() || p.fandom;
      p.debut = $('#p-debut').value || p.debut; p.birth = $('#p-birth').value || p.birth; p.company = $('#p-company').value.trim() || p.company; p.trainee = $('#p-trainee').value || p.trainee; p.animal = $('#p-animal').value.trim() || p.animal;
      p.followers = Math.max(0, +$('#p-fol').value || p.followers); p.folBase = p.followers;
      const a1 = Math.max(1, +$('#p-amin').value || p.activeMin), a2 = Math.max(a1, +$('#p-amax').value || p.activeMax); p.activeMin = a1; p.activeMax = a2;
      p.nicks = $('#p-nicks').value.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean);
      p.bio = $('#p-bio').value.trim(); p.fanRules = $('#p-fanrules').value.trim();
      save(); render(); toast('人设已保存'); break;
    }
    case 'aisave': S.ai.capCny = Math.max(0, +$('#ai-cap').value || 0); S.ai.enabled = $('#ai-on').checked; S.ai.key = $('#ai-key').value.trim(); S.ai.model = $('#ai-model').value; S.ai._backoff = 0; save(); render(); toast(S.ai.enabled && S.ai.key ? 'AI 粉丝已开启 ✨' : 'AI 设置已保存'); break;
    case 'aitest': {
      S.ai.key = $('#ai-key').value.trim(); S.ai.model = $('#ai-model').value;
      if (!S.ai.key) { toast('请先填写 API Key'); break; }
      t.disabled = true; t.textContent = '测试中…';
      try { const r = await aiComments([{ type: 'text', text: `${S.profile.name} 发帖：「测试一下，大家能看到吗？」请生成 3 条粉丝评论。` }], 2000); S.ai.lastError = ''; S.ai._backoff = 0; save(); toast('连接成功 ✨', r.map(x => x.text).join(' / ')); }
      catch (err) { toast('连接失败', String(err.message || err)); S.ai.lastError = String(err.message || err); save(); }
      t.disabled = false; t.textContent = '测试连接'; break;
    }
    case 'export': {
      const blob = new Blob([JSON.stringify(S, (k, v) => k.startsWith('_') || k === 'key' ? undefined : v, 1)], { type: 'application/json' });
      const filename = `sia-space-${dkey(Date.now())}.json`;
      // 在 claude.ai 链接里打开时走平台的下载确认；直接打开本地文件时用普通下载
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
      if (dl) { try { await dl.save({ filename, data: blob }); toast('已导出'); } catch (err) { if (err && err.code !== 'declined') toast('导出失败', err.message || String(err.code)); } break; }
      const aEl = document.createElement('a'); aEl.href = URL.createObjectURL(blob); aEl.download = filename; aEl.click(); break;
    }
    case 'reset': if (confirm('确定重置所有数据？帖子、评论、行程都会清空。')) { localStorage.removeItem(STORE_KEY); indexedDB.deleteDatabase('cyan-idol-media'); location.reload(); } break;
  }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'r-cat') { locQSync(); syncWorkField(); }
  if (e.target.id === 'r-work') syncWorkField();
  if (e.target.id === 'r-cbt') e.target.dataset.touched = 1;
  if ((e.target.id === 'al-tbd' || e.target.id === 'al-copick') && UI.alb) { albCollect(); openModal(albHTML()); return; }
  if (e.target.classList && e.target.classList.contains('chbf-g')) { const row = e.target.parentElement, ps = row.querySelector('.chbf-p'), ss = row.querySelector('.chbf-s'); ps.innerHTML = chMemberOpts(e.target.value); ps.style.display = ss.style.display = e.target.value ? '' : 'none'; return; }
  if (e.target.dataset && e.target.dataset.gtype !== undefined) { const t = e.target, box = t.closest('.gpick'); box.outerHTML = giftPickHTML(t.dataset.gtype, t.dataset.gcat, t.value ? t.value + ':0' : ''); return; }
  const t = e.target;
  if (t.id === 'cmp-file') {
    for (const f of t.files) {
      if (f.size > 300 * 1024 * 1024) { toast('文件太大了（>300MB）', f.name); continue; }
      f._url = URL.createObjectURL(f); pending.push(f);
    }
    if (pending.length > 9) { pending.slice(9).forEach(f => URL.revokeObjectURL(f._url)); pending = pending.slice(0, 9); toast('最多 9 个图片/视频'); }
    t.value = ''; renderPending();
  } else if (t.id === 'av-file' && t.files[0]) {
    const id = uid(); const f = t.files[0];
    try { await idbPut(id, f); } catch (err) { }
    urlCache[id] = URL.createObjectURL(f);
    if (S.profile.avatar) idbDel(S.profile.avatar);
    S.profile.avatar = id; save(); render(); toast('头像已更新');
  } else if (t.id === 'imp-file' && t.files[0]) {
    try { const j = JSON.parse(await t.files[0].text()); if (!j.profile || !j.posts) throw new Error('格式不对'); j.ai = Object.assign({}, S.ai, j.ai, { key: S.ai.key }); S = j; save(); location.reload(); }
    catch (err) { toast('导入失败', err.message); }
  } else if (t.id === 'bb-file' && t.files[0]) {
    const f = t.files[0]; t.value = ''; bbDraftAdd(f.type.startsWith('video') ? 'video' : 'image', { blob: f });
  } else if ((t.id === 'bb-av-file' || t.id === 'bb-wall-file') && t.files[0]) {
    const id = uid(), f = t.files[0]; try { await idbPut(id, f); } catch (err) { } urlCache[id] = URL.createObjectURL(f);
    if (t.id === 'bb-av-file') { if (S.bubble.avatar) idbDel(S.bubble.avatar); S.bubble.avatar = id; }
    else { if (S.bubble.wallImg) idbDel(S.bubble.wallImg); S.bubble.wallImg = id; S.bubble.wall = 'custom'; bbWallpaper(); }
    save(); openModal(bbSettingsHTML());
  } else if (t.id === 'r-rep') syncRepFields();
  else if (t.id === 'ch-sel') { UI.chartTrk = t.value; render(); }
  else if (t.dataset && t.dataset.act === 'resttg') { const R = S.schedule.rest || (S.schedule.rest = {}); if (t.checked) R[t.dataset.k] = 1; else delete R[t.dataset.k]; save(); render(); }
  else if (t.id === 'pf-tr') { S.prefs.autoTr = t.checked; save(); }
  else if (t.id === 'pf-speed') { S.prefs.speed = +t.value; save(); toast(`时间流速 ${t.value}×`); }
  else if (t.id === 'pf-sys') {
    S.prefs.sysNotif = t.checked; save();
    if (t.checked && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'r-title') syncWorkField();
  if (e.target.id === 'b-level') { S.prefs.beauty = Object.assign(beautyCfg(), { level: +e.target.value }); const v = $('#b-val'); if (v) v.textContent = e.target.value; applyBeauty(); save(); }
  if (e.target.id === 'w-in' || e.target.id === 'w-cur') walletPreview();
  if ((e.target.id === 'al-date' || e.target.id === 'al-weeks') && $('#al-warn')) { $('#al-warn').innerHTML = cbRivalWarn($('#al-date').value, +$('#al-weeks').value); if ($('#al-pwarn')) $('#al-pwarn').innerHTML = prepDateWarn({ ...UI.alb, date: $('#al-date').value, type: $('#al-type').value }); }
  if (e.target.id === 'cmp-text') draft = e.target.value;
  if (e.target.id === 'cmp-desc') draftDesc = e.target.value;
  if (e.target.id === 'bb-in') { UI.bbDraft = e.target.value; e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 110) + 'px'; }
  if (e.target.id === 'preset-q') { UI.presetQ = e.target.value; $$('.pcat').forEach(x => x.classList.toggle('on', !UI.presetQ && x.dataset.c === UI.presetCat)); $('#plist').innerHTML = presetListHTML(); }
});
// 点「发送」不让输入框失去焦点（键盘不收起、界面不跳）
document.addEventListener('pointerdown', e => { const b = e.target.closest && e.target.closest('[data-act=dmsend],[data-act=mgrsend]'); if (b) e.preventDefault(); }, true);
document.addEventListener('mousedown', e => { const b = e.target.closest && e.target.closest('[data-act=dmsend],[data-act=mgrsend]'); if (b) e.preventDefault(); }, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  if (e.target.id === 'rep-in') { e.preventDefault(); sendReply(); }
  if (e.target.id === 'my-cmt') { e.preventDefault(); myComment(); }
});

/* =========================================================
   启动
   ========================================================= */
function seedPosts() {
  if (S.seeded) return;
  S.seeded = true;
  pushNotif({ type: 'system', text: '社区开通啦！', sub: '发第一条帖子和粉丝们打个招呼吧 🐱' }, false);
}
// 旧版本数据迁移：去掉示例帖子、示例行程和旧简介
function migrate() {
  if (!S.disco) {
    // 旧版的「你的歌」→ 歌单；旧版的回归 → 新格式
    S.disco = (S.profile.songs || []).filter(Boolean).map(x => ({ id: uid(), name: x, type: 'single', date: '', tracks: [{ name: x, title: true }] }));
    if (S.cb && S.cb.song && !S.cb.albumId) {
      let a = S.disco.find(x => x.name === S.cb.song); if (!a) { a = { id: uid(), name: S.cb.song, type: 'single', date: S.cb.date, tracks: [{ name: S.cb.song, title: true }] }; S.disco.push(a); }
      a.date = S.cb.date; S.cb = { albumId: a.id, date: S.cb.date, weeks: 3, day: parseD(addDays(S.cb.date, 2)).getDay(), rest: false, follow: '', done: S.cb.done || {}, res: (S.cb.res || []).map(x => ({ label: `主打第 ${x.w} 周`, song: a.name, rank: x.rank, at: x.at })), over: S.cb.over };
    }
  }
  if ((S.v || 1) < 3) {
    // 「上课/练习」拆成「上课」和「练习」
    S.schedule.rules.forEach(r => { if (r.cat === '上课/练习') r.cat = /课/.test(r.title) ? '上课' : '练习'; });
  }
  S.schedule.rules.forEach(r => { if (r.cat === '校庆') r.cat = '公演'; }); // 校庆并进公演
  if ((S.v || 1) >= 2) { S.v = Math.max(S.v || 1, 3); return; }
  const oldPosts = /^(今天的舞蹈练习终于结束啦！腿已经不是自己的了|下周就是签售会了！好想快点见到)/;
  S.posts = S.posts.filter(p => !oldPosts.test(p.text));
  S.notifs = S.notifs.filter(n => !/平行世界/.test(n.text) && (!n.postId || S.posts.some(p => p.id === n.postId)));
  if (/^平行世界 solo 歌手/.test(S.profile.bio || '')) S.profile.bio = '';
  const oldRules = ['早间体能训练', '声乐课', '舞蹈练习', '《星光音乐局》事前录制', '《周四舞台》直播打歌', '《人气旋律》打歌', 'Weverse 日常 vlog 拍摄', '杂志《MEOW》画报拍摄', '综艺《猫咪也疯狂》录制', '二辑线下签售会', '首场 Solo 演唱会《CYAN: 9.1Hz》'];
  S.schedule.rules = S.schedule.rules.filter(r => !oldRules.includes(r.title));
  delete S.schedule.flex;
  S.v = 3;
}
migrate();
seedPosts();
catchUp();
S.sim.lastTick = Date.now();
save();
render();
hotBar();
setInterval(tick, 1500);
setTimeout(() => { if (S.chBF) return; const l = chBackfillList(); if (!l.length || $('#modal').classList.contains('on')) return; openModal(chBackfillHTML(l)); }, 6000); // 补 challenge 只弹一次
setInterval(flushAgg, 6000);
setInterval(() => { if (UI.tab === 'sched' && !$('#modal').classList.contains('on') && !document.activeElement?.closest('#view input')) render(); }, 60000);
window.addEventListener('beforeunload', () => { S.sim.lastTick = Date.now(); try { localStorage.setItem(STORE_KEY, JSON.stringify(S, (k, v) => k.startsWith('_') ? undefined : v)); } catch (e) { } });
</script>
