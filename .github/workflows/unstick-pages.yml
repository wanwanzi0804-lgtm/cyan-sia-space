# 一次性工具：取消卡住的 GitHub Pages 发布（用完会删掉）
name: unstick pages
on:
  push:
    paths: ['.github/workflows/unstick-pages.yml']
  workflow_dispatch:
permissions:
  pages: write
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in 3a093dddd9c91b78a82d7a9a0249a811ba9d0085 a2e27de6c8522a9bf99822c49e03bbe4280e4162; do
            echo "cancel deployment $sha"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel" -w " -> %{http_code}\n"
          done
          for run in 38595053654 38596868146; do
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run/force-cancel" -w " -> %{http_code}\n"
          done
